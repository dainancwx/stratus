<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Chase Map | Dainan Caywood WX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo-text shimmer-silver">Dainan Caywood WX</div>

  <div class="menu-toggle" id="mobile-menu">☰</div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html"><span>Home</span></a></li>
      <li><a href="projects.html"><span>Projects</span></a></li>
      <li><a href="gallery.html"><span>Gallery</span></a></li>
      <li><a href="chases.html"><span>Chases</span></a></li>
      <li><a href="about.html"><span>About Me</span></a></li>
    </ul>
  </nav>
</header>

<main>

<section>
<h1>Storm Chase Map</h1>
<p>Click a state to view my chase history.</p>

<!-- REAL SVG MAP FILE -->
<div style="max-width:1100px; margin:auto; padding-top:25px;">
<object
id="us-map"
type="image/svg+xml"
data="us.svg"
style="width:100%; height:700px; border:none;">
</object>
</div>

<!-- INFO BOX -->
<div id="state-info" style="
margin-top:30px;
padding:25px;
background:#111;
color:white;
border-radius:12px;
">
<h2>Select a State</h2>
<p>Your chase history will appear here.</p>
</div>

</section>

</main>

<footer>
<p>© 2026 Dainan Caywood | All rights reserved</p>
</footer>

<style>
/* loaded svg states */
.hovered{
fill:#00bfff !important;
transition:0.2s;
cursor:pointer;
}

.visited{
fill:#333 !important;
}
</style>

<script>

/* MOBILE MENU */
const menu = document.getElementById("mobile-menu");
const navLinks = document.querySelector(".nav-links");

menu.addEventListener("click", () => {
navLinks.classList.toggle("active");
});

/* YOUR CHASE DATA */
const chaseData = {

MO:{name:"Missouri",text:"14 Chases • Home state • Multiple severe weather intercepts."},
KS:{name:"Kansas",text:"6 Chases • Classic plains supercells."},
OK:{name:"Oklahoma",text:"4 Chases • Tornadic dryline setups."},
TX:{name:"Texas",text:"3 Chases • Large hail and photogenic storms."},
NE:{name:"Nebraska",text:"2 Chases • Evening structure storms."},
IA:{name:"Iowa",text:"1 Chase • Shelf cloud event."},
CO:{name:"Colorado",text:"2 Chases • High plains supercells."},
AR:{name:"Arkansas",text:"1 Chase • Dixie Alley setup."},
IL:{name:"Illinois",text:"2 Chases • QLCS severe weather."},
FL:{name:"Florida",text:"Vacation storms and lightning photography."}

};

/* LOAD SVG */
document.getElementById("us-map").addEventListener("load", function(){

const svgDoc = this.contentDocument;

/* Try all paths */
const states = svgDoc.querySelectorAll("path");

states.forEach(state=>{

const id = state.id.toUpperCase();

/* dark default */
state.style.fill = "#222";
state.style.stroke = "#fff";
state.style.strokeWidth = "1";
state.style.cursor = "pointer";

/* visited states darker blue */
if(chaseData[id]){
state.style.fill = "#2d3e50";
}

state.addEventListener("mouseenter", ()=>{
state.style.fill = "#00bfff";
});

state.addEventListener("mouseleave", ()=>{
if(chaseData[id]){
state.style.fill = "#2d3e50";
}else{
state.style.fill = "#222";
}
});

state.addEventListener("click", ()=>{

if(chaseData[id]){
document.getElementById("state-info").innerHTML = `
<h2>${chaseData[id].name}</h2>
<p>${chaseData[id].text}</p>
`;
}else{
document.getElementById("state-info").innerHTML = `
<h2>${id}</h2>
<p>No chase data added yet.</p>
`;
}

});

});

});
</script>

</body>
</html>
