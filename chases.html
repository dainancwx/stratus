<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Chase Map | Dainan Caywood WX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo-text shimmer-silver">Dainan Caywood WX</div>

  <div class="menu-toggle" id="mobile-menu">☰</div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html"><span>Home</span></a></li>
      <li><a href="projects.html"><span>Projects</span></a></li>
      <li><a href="gallery.html"><span>Gallery</span></a></li>
      <li><a href="chases.html"><span>Chases</span></a></li>
      <li><a href="about.html"><span>About Me</span></a></li>
    </ul>
  </nav>
</header>

<main>

<section>
<h1>Storm Chase Map</h1>
<p>Click a state to view my chase history.</p>

<!-- IMPORTANT: use INLINE SVG instead of <object> -->
<div style="max-width:1100px; margin:auto; padding-top:25px;">
  <!-- Paste the ENTIRE contents of us.svg below this line -->
  <div id="svg-container">
    <!-- REPLACE THIS COMMENT WITH YOUR us.svg CODE -->
  </div>
</div>

<div id="state-info" style="
margin-top:30px;
padding:25px;
background:#111;
color:#fff;
border-radius:12px;
min-height:140px;
">
<h2 style="color:#00bfff;">Select a State</h2>
<p>Click any state on the map.</p>
</div>

</section>

</main>

<footer>
<p>© 2026 Dainan Caywood | All rights reserved</p>
</footer>

<script>
/* MOBILE MENU */
document.getElementById("mobile-menu").onclick = () => {
document.querySelector(".nav-links").classList.toggle("active");
};

/* CHASE DATA */
const chaseData = {
MO:{name:"Missouri",text:"14 Chases • Home state • Severe weather intercepts."},
KS:{name:"Kansas",text:"6 Chases • Plains supercells."},
OK:{name:"Oklahoma",text:"4 Chases • Tornadic dryline setups."},
TX:{name:"Texas",text:"3 Chases • Large hail and storms."},
NE:{name:"Nebraska",text:"2 Chases • Evening structure storms."},
IA:{name:"Iowa",text:"1 Chase • Shelf cloud event."},
IL:{name:"Illinois",text:"2 Chases • QLCS severe weather."},
CO:{name:"Colorado",text:"2 Chases • High plains storms."},
AR:{name:"Arkansas",text:"1 Chase • Dixie Alley setup."},
FL:{name:"Florida",text:"Lightning photography."}
};

/* WAIT FOR PAGE */
window.onload = () => {

const states = document.querySelectorAll("#svg-container svg path");

/* fix issue: some states use lowercase ids */
states.forEach(state => {

let code = state.id.trim().toUpperCase();

/* store clean code */
state.dataset.code = code;

/* style */
state.style.fill = "#1f1f1f";
state.style.stroke = "#ffffff";
state.style.strokeWidth = "1";
state.style.cursor = "pointer";
state.style.transition = "0.2s";

/* hover */
state.addEventListener("mouseenter", () => {
state.style.fill = "#00bfff";
});

state.addEventListener("mouseleave", () => {
if(!state.classList.contains("selected")){
state.style.fill = "#1f1f1f";
}
});

/* click */
state.addEventListener("click", () => {

/* remove old selected state only */
states.forEach(s=>{
s.classList.remove("selected");
s.style.fill = "#1f1f1f";
});

/* select clicked state */
state.classList.add("selected");
state.style.fill = "#00bfff";

let id = state.dataset.code;

if(chaseData[id]){
document.getElementById("state-info").innerHTML = `
<h2 style="color:#00bfff;">${chaseData[id].name}</h2>
<p style="font-size:18px;">${chaseData[id].text}</p>
`;
}else{
document.getElementById("state-info").innerHTML = `
<h2 style="color:#00bfff;">${id}</h2>
<p style="font-size:18px;">No chase data added yet.</p>
`;
}

});

});

};
</script>

</body>
</html>
