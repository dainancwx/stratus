<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Chase Map | Dainan Caywood WX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo-text shimmer-silver">Dainan Caywood WX</div>

  <div class="menu-toggle" id="mobile-menu">☰</div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html"><span>Home</span></a></li>
      <li><a href="projects.html"><span>Projects</span></a></li>
      <li><a href="gallery.html"><span>Gallery</span></a></li>
      <li><a href="chases.html"><span>Chases</span></a></li>
      <li><a href="about.html"><span>About Me</span></a></li>
    </ul>
  </nav>
</header>

<main>

<section>
<h1>Storm Chase Map</h1>
<p>Click a state to view my chase history.</p>

<!-- MAP -->
<div style="max-width:1100px; margin:auto; padding-top:25px;">
<object
id="us-map"
type="image/svg+xml"
data="us.svg"
style="width:100%; height:700px; border:none;">
</object>
</div>

<!-- INFO BOX -->
<div id="state-info" style="
margin-top:30px;
padding:25px;
background:#111;
color:#ffffff;
border-radius:12px;
min-height:140px;
">

<h2 style="color:#00bfff; margin-bottom:10px;">Select a State</h2>
<p style="color:#ffffff;">Your chase history will appear here.</p>

</div>

</section>

</main>

<footer>
<p>© 2026 Dainan Caywood | All rights reserved</p>
</footer>

<script>

/* MOBILE MENU */
const menu = document.getElementById("mobile-menu");
const navLinks = document.querySelector(".nav-links");

menu.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});

/* CHASE DATA */
const chaseData = {

IL:{
name:"Illinois",
text:"2 Chases • QLCS severe weather • Wind events."
},

MO:{
name:"Missouri",
text:"14 Chases • Home state • Multiple severe weather intercepts."
},

KS:{
name:"Kansas",
text:"6 Chases • Classic plains supercells."
},

OK:{
name:"Oklahoma",
text:"4 Chases • Tornadic dryline setups."
},

TX:{
name:"Texas",
text:"3 Chases • Large hail and photogenic storms."
},

NE:{
name:"Nebraska",
text:"2 Chases • Evening structure storms."
},

IA:{
name:"Iowa",
text:"1 Chase • Shelf cloud event."
},

CO:{
name:"Colorado",
text:"2 Chases • High plains supercells."
},

AR:{
name:"Arkansas",
text:"1 Chase • Dixie Alley setup."
},

FL:{
name:"Florida",
text:"Vacation storms and lightning photography."
}

};

/* LOAD SVG */
document.getElementById("us-map").addEventListener("load", function(){

const svgDoc = this.contentDocument;

/* GET ALL STATES */
const states = svgDoc.querySelectorAll("path");

/* LOOP STATES */
states.forEach(state => {

let id = state.id.trim().toUpperCase();

/* DEFAULT LOOK */
state.style.fill = "#1f1f1f";
state.style.stroke = "#ffffff";
state.style.strokeWidth = "1";
state.style.cursor = "pointer";
state.style.transition = "0.2s";

/* HOVER */
state.addEventListener("mouseenter", () => {
state.style.fill = "#00bfff";
});

state.addEventListener("mouseleave", () => {
state.style.fill = "#1f1f1f";
});

/* CLICK */
state.addEventListener("click", () => {

if(chaseData[id]){

document.getElementById("state-info").innerHTML = `
<h2 style="color:#00bfff; margin-bottom:10px;">${chaseData[id].name}</h2>
<p style="color:#ffffff; font-size:18px;">${chaseData[id].text}</p>
`;

}else{

document.getElementById("state-info").innerHTML = `
<h2 style="color:#00bfff; margin-bottom:10px;">${id}</h2>
<p style="color:#ffffff; font-size:18px;">No chase data added yet.</p>
`;

}

});

});

});

</script>

</body>
</html>
